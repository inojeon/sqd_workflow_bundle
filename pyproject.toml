[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqd-ibm-workflow-bundle"
version = "0.1.0"
description = "Standalone IBM small-scale SQD workflow handoff"
requires-python = ">=3.11,<3.12"
dependencies = [
  "qiskit==2.5.2",
  "qiskit-addon-sqd==0.13.1",
  "ffsim==0.0.84",
  "pyscf==2.14.0",
  "numpy==2.4.6",
  "scipy==1.17.1",
  "threadpoolctl==3.7.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
docs = ["Markdown==3.8.2"]
# STEP 4 MPI 배치 병렬. 사이트 MPI로 소스 빌드: MPICC=<mpi>/bin/mpicc, uv의 --no-binary-package mpi4py
mpi = ["mpi4py==4.1.2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sqd_workflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "reference: official N2 reproduction",
  "mpi: STEP 4 MPI run (needs mpi4py and mpiexec or SQD_MPIEXEC)",
]
